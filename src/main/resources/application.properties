spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/eventostec_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345678}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=DEBUG


aws.s3.bucket=${ORACLE_BUCKET}
aws.s3.endpoint=${ORACLE_BUCKET_ENDPOINT}
aws.s3.region=${ORACLE_REGION}
aws.s3.access-key=${ORACLE_ACCESS_KEY}
aws.s3.secret-key=${ORACLE_SECRET_KEY}